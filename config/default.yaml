# COASTLINE - default configuration
#
# Every path below is RELATIVE to `data_dir` (inputs) or `results_dir` (outputs),
# unless it is absolute. Do not edit this file to point to your own folders:
# create `config/local.yaml` (ignored by Git) with only the values that differ
# on your computer, or set the environment variables
# COASTLINE_DATA_DIR / COASTLINE_RESULTS_DIR (for example in a `.env` file).

data_dir: data
results_dir: results

crs: EPSG:32636            # WGS 84 / UTM zone 36N, working CRS of the whole framework

# ---------------------------------------------------------------- inputs
inputs:
  # The 8 normalized Hazard factors on the common 30 m grid (output of the
  # preprocessing step, archived with the article as underlying data).
  factors:
    SAI:  factors/SAI.tif     # Seismic Activity
    BUI:  factors/BUI.tif     # Built-up Density
    LSI:  factors/LSI.tif     # Landslide Susceptibility
    CPI:  factors/CPI.tif     # Coastal Proximity
    FFI:  factors/FFI.tif     # Fire Footprint
    RNI:  factors/RNI.tif     # Road Proximity
    SLRI: factors/SLRI.tif    # Soil Loss Rate
    FHI:  factors/FHI.tif     # Fluvial Hydrography

  site_points: sites/site_points.geojson      # 34 site points (id, name)
  site_polygons: sites/site_polygons.geojson  # site polygons from OpenStreetMap (id, name)
  site_attributes: sites/site_attributes.csv  # Heritage, Enclosure, Shelter (scored by photo-interpretation)
  site_raster_values: sites/site_raster_values.csv   # Land Use code, elevation, slope, distance to coast
  exposure_reviews: sites/exposure_reviews.csv       # Google Places review counts (July 2026)

  # Rasters and vectors used only to (re)build the tables above and for the
  # Vulnerability support test. Not needed to reproduce the indices.
  dem: raw/dem/cy_SRTMGL1_30m.tif
  slope: raw/dem/Slope_cyprus.tif
  worldcover: raw/worldcover/ESA_WorldCover_10m_2021_v200_Cyprus.tif
  erm_gpkg: raw/erm/FullEurope.gpkg           # EuroRegionalMap 2025
  coastline_layer: CoastL                     # NOT the default layer of the GeoPackage (PolbndL)

  # Raw sources of the preprocessing step (raw -> normalized factors).
  # The vector layers were stored in PostGIS: export the PostGIS layers to the
  # GeoPackage files listed under inputs (raw/postgis/).
  boundary: raw/postgis/world_countries_cyprus.gpkg     # land boundary (also the land mask)
  coastline_polygon: raw/postgis/Coastline_Cyprus.gpkg  # CPI
  roads: raw/postgis/Roads_cyprus.gpkg                  # RNI (EuroRegionalMap roads)
  rivers: raw/postgis/Drain_cyprus.gpkg                 # FHI (EuroRegionalMap watercourses)
  effis_fires: raw/postgis/Fires_2018_buffered_cyprus.gpkg  # FFI (EFFIS 2003-2018, buffered 100 m)
  gem_pga: raw/gem/v2023_1_pga_475_rock_3min.tif        # SAI
  ghs_built_2018: raw/ghsl/GHS_BUILT_2018_cyprus.tif    # BUI
  elsus: raw/elsus/ELSUSv2_LANDSLIDE_cyprus.tif         # LSI
  rusle: raw/rusle/Erosion_2016_UTM_Cyprus.tif          # SLRI

# ---------------------------------------------------------------- parameters
# Values of the article (Open Research Europe, Draft v3). Changing them
# changes the results.
hazard:
  sample_fraction: 0.02          # pixel sample for the Pearson correlation and the PCA
  seed: 42
  redundancy_r: 0.70             # |r| above this flags a redundant pair (Dormann et al., 2013)
  kaiser_eigenvalue: 1.0
  cumulative_variance: 0.75
  marginal_loading: 0.30
  cond_prob_percentile: 75       # "high" pixel of a factor, Eq. 14
  n_classes: 5

vulnerability:
  n_classes: 3
  search_px_dem: 15              # nearest valid pixel window, elevation and slope
  search_px_worldcover: 100      # nearest valid pixel window, Land Use

exposure:
  n_classes: 5

risk:
  buffer_m: 125                  # Hazard Index at a site = max within this buffer
  buffer_max_m: 1000             # doubled until a valid pixel is found, up to this radius
  vi_rescale: {1: 1, 2: 3, 3: 5} # 3 Vulnerability classes stretched to the 1-5 range
  n_classes: 3

preprocess:
  resolution_m: 30
  cpi_bands_m: [200, 500, 1000]
  cpi_values: [1.0, 0.67, 0.33, 0.0]
  road_buffer_m: 250
  river_buffer_m: 150
  fire_reference_year: 2018
  fire_decay_k: 0.5
  fire_floor: 0.25
  rusle_cap: 10.0                # t/ha/yr (Agapiou et al., 2020)

sensitivity:
  oat_range: 0.20                # +-20 % of each weight
  oat_step: 0.01
  oat_pixel_sample_fraction: 0.15
  oat_site_deltas: [-0.20, -0.10, 0.10, 0.20]
  fixed_thresholds:              # (Elevation t1, t2), (Distance to Coast t1, t2), metres
    set_1: [[10, 50], [200, 1000]]
    set_2: [[10, 30], [200, 500]]
    set_3: [[10, 50], [500, 2000]]
  polygon_match_max_m: 300
